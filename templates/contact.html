{% extends "base.html" %}

{% block title %}Contact{% endblock %}

{% block content %}
<section class="page" aria-labelledby="contact-heading">
    <header class="page-header">
        <h1 id="contact-heading">Contact Us</h1>
        <p>Questions about appointments, beds, or partnerships? Reach out anytime.</p>
    </header>

    <form class="form-panel" action="#" method="get" aria-label="Contact form">
        <div class="form-group">
            <label for="contact-name">Name</label>
            <input type="text" id="contact-name" name="name" placeholder="Your name" autocomplete="name">
        </div>
        <div class="form-group">
            <label for="contact-email">Email</label>
            <input type="email" id="contact-email" name="email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" rows="4" placeholder="How can we help?"></textarea>
        </div>
        <button type="button" class="btn btn-primary" data-welcome>Send message</button>
    </form>
</section>
{% endblock %}
