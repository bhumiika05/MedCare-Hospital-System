```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MedCare | Registration</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">


<style>

body{

    background:linear-gradient(135deg,#0ea5e9,#2563eb);

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:Arial, sans-serif;

}


.card{

    width:500px;

    border:none;

    border-radius:20px;

    box-shadow:0 15px 35px rgba(0,0,0,.25);

}


.form-control,
.form-select{

    border-radius:10px;

}


.btn-primary{

    border-radius:10px;

    padding:12px;

}


</style>


</head>


<body>


<div class="card p-4">


<div class="text-center mb-4">


<i class="fa-solid fa-hospital fa-3x text-primary"></i>


<h2 class="mt-3">

MedCare

</h2>


<p class="text-muted">

Create your account

</p>


</div>




<form method="POST" action="/register">


<div class="mb-3">

<label class="form-label">

Full Name

</label>


<input

type="text"

name="fullname"

class="form-control"

placeholder="Enter full name"

required>

</div>





<div class="mb-3">

<label class="form-label">

Username

</label>


<input

type="text"

name="username"

class="form-control"

placeholder="Choose username"

required>

</div>





<div class="mb-3">

<label class="form-label">

Email

</label>


<input

type="email"

name="email"

class="form-control"

placeholder="Enter email"

required>

</div>





<div class="mb-3">

<label class="form-label">

Phone Number

</label>


<input

type="text"

name="phone"

class="form-control"

placeholder="Enter phone number"

required>

</div>





<div class="mb-3">

<label class="form-label">

Register As

</label>


<select

name="role"

class="form-select"

required>


<option value="Patient">

Patient

</option>


<option value="Doctor">

Doctor

</option>


<option value="Hospital">

Hospital

</option>


<option value="City">

City Authority

</option>


</select>


</div>





<div class="mb-3">

<label class="form-label">

Password

</label>


<input

type="password"

name="password"

class="form-control"

placeholder="Create password"

required>

</div>





<button

type="submit"

class="btn btn-primary w-100">


<i class="fa-solid fa-user-plus"></i>

Register


</button>


</form>





<hr>


<div class="text-center">


Already have an account?


<a href="/login">

Login

</a>


</div>



</div>


</body>

</html>
```
