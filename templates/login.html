<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MedCare | Patient Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }

        body{

            background:linear-gradient(135deg,#2563eb,#06b6d4);

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

        }

        .login-card{

            width:420px;

            background:white;

            border-radius:20px;

            padding:40px;

            box-shadow:0 15px 40px rgba(0,0,0,.2);

        }

        h2{

            text-align:center;

            margin-bottom:10px;

            color:#2563eb;

        }

        p{

            text-align:center;

            color:gray;

            margin-bottom:25px;

        }

        .btn-primary{

            width:100%;

            border-radius:10px;

            padding:12px;

            font-size:17px;

        }

        .logo{

            text-align:center;

            font-size:55px;

            color:#2563eb;

            margin-bottom:15px;

        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="logo">

        <i class="fa-solid fa-hospital-user"></i>

    </div>

    <h2>

        MedCare

    </h2>

    <p>

        Patient Login

    </p>

    {% if error %}

    <div class="alert alert-danger">

        {{ error }}

    </div>

    {% endif %}

    <form method="POST">

        <div class="mb-3">

            <label>Email Address</label>

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter Email"
                required>

        </div>

        <div class="mb-4">

            <label>Password</label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter Password"
                required>

        </div>

        <button
            class="btn btn-primary">

            <i class="fa-solid fa-right-to-bracket"></i>

            Login

        </button>

    </form>

    <hr>

    <div class="text-center">

        New Patient?

        <a href="/register">

            Register Here

        </a>

    </div>

    <br>

    <div class="text-center">

        <a href="/">

            ← Back to Home

        </a>

    </div>

</div>

</body>

</html>
